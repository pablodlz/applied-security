# Example GitHub Actions security pipeline (Challenge 2)
# ---------------------------------------------------------------------------
# Runs SAST (Horusec) on every push and pull request, and an optional DAST
# baseline (OWASP ZAP) against a locally-built target.
#
# Adapt to your project. Nothing secret is hardcoded — any tokens go through
# GitHub Actions "Secrets" (Settings -> Secrets and variables -> Actions).
#
# Place at: .github/workflows/security.yml
# ---------------------------------------------------------------------------
name: Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Horusec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Horusec
        run: |
          curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest
          horusec start -p ./ -o json -O horusec-report.json --disable-docker
        # non-zero exit on findings is expected; keep the report as an artefact
        continue-on-error: true

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: horusec-report
          path: horusec-report.json

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: sast
    # DAST needs a running target. For a real project, start your app here
    # (or point ZAP at a deployed staging URL). This job is illustrative.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start target (example)
        run: |
          # e.g. docker run -d -p 3000:3000 bkimminich/juice-shop
          echo "Start your app on http://localhost:3000 before scanning."

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
        continue-on-error: true
